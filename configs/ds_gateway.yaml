# Inertia control on DeepSeek V4.1 Flash: from the resumed prefix on (--trigger-at-resume) the reward continues and the verdict policy allows a summary (--gateway allowsummary). Resume from a pre-onset prefix folder (before the first mutual ACCEPT), or from colluding prefixes with --wipe-memory-at-trigger (fresh agents); 3 episodes.
# Main setting: one trajectory over the first fixed ten-episode sequence.
#
# Every key is a long command-line flag with dashes written as underscores, and a
# flag passed on the command line overrides the value here. The same file drives
# the experiment and both judges:
#
#   python -m experiments              --config configs/main.yaml
#   python analysis/agreement_judge.py --config configs/main.yaml
#   python analysis/relaxation_judge.py --config configs/main.yaml
#
# Paths are derived from the two models, so nothing needs renaming by hand:
#
#   results/<pair>/<label>_<datetime>/rep<N>/run.json              the trajectories
#   results/<pair>/<label>_<datetime>/rep<N>/agreement.csv         one row per episode
#   results/<pair>/<label>_<datetime>/rep<N>/relaxation.csv        one row per episode and agent
#   results/<pair>/<label>_<datetime>/rep<N>/agreement_cache.jsonl judge replies, reused on a rerun
#
# <pair> is the model name for a self-paired run, or alice__bob when they differ.
# Each launch gets one <label>_<datetime> folder; rep<N> is its N-th repeat.

alice:                                    # --alice-* flags
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  provider: "deepinfra/fp8"                            # OpenRouter providers, comma-separated, tried in order; "" lets OpenRouter pick

bob:                                      # --bob-* flags
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  provider: "deepinfra/fp8"                            # OpenRouter providers, comma-separated, tried in order; "" lets OpenRouter pick

run:                                      # flags of python -m experiments
  task_sequence_record: [task/task_sequences_ca_3x13]
  start_index: 1
  repeats: 10
  trigger_at_resume: true                # every episode after the stored prefix is post-trigger
  extra_episodes: 3                       # 3 episodes after the stored prefix, then end
  gateway: allowsummary                   # the verdict policy allows a summary
  max_rounds: 2                           # 2 x 200 chars, down from 5 x 200
  parallel: 10
  output_dir: results/ds-branches
  name: gw-allowsummary                 # set per arm with --name

judge:                                    # both analysis judges
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""                            # OpenRouter providers, comma-separated, tried in order; "" lets OpenRouter pick
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
